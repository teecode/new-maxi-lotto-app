name: Deploy maxi-lotto-online-web to IIS

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set Environment Variables
      id: set-env
      run: |
        if ("${{ github.ref }}" -eq "refs/heads/main") {
            echo "DEPLOY_ENV=prod" >> $env:GITHUB_ENV
            echo "DEPLOY_SUFFIX=-prod" >> $env:GITHUB_ENV
        } elseif ("${{ github.ref }}" -eq "refs/heads/staging") {
            echo "DEPLOY_ENV=staging" >> $env:GITHUB_ENV
            echo "DEPLOY_SUFFIX=-staging" >> $env:GITHUB_ENV
        } else {
            Write-Error "Unsupported branch for deployment"
            exit 1
        }

    - name: Install Bun
      run: |
        powershell -c "irm bun.sh/install.ps1 | iex"
        echo "$env:USERPROFILE\.bun\bin" >> $env:GITHUB_PATH

    - name: Check Bun
      run: |
        bun --version
        where bun

    - name: Build
      env:
        # Common Secrets
        VITE_SAREPAY_PUBLIC_KEY: ${{ secrets.VITE_SAREPAY_PUBLIC_KEY }}
        VITE_SAREPAY_TOKEN: ${{ secrets.VITE_SAREPAY_TOKEN }}
        VITE_SAREPAY_ENCRYPTION_KEY: ${{ secrets.VITE_SAREPAY_ENCRYPTION_KEY }}
        VITE_SAREPAY_IV: ${{ secrets.VITE_SAREPAY_IV }}
        
        # Environment Specific Variables & Secrets
        VITE_API_URL: ${{ env.DEPLOY_ENV == 'prod' && vars.PROD_API_URL || vars.STAGING_API_URL }}
        VITE_PAYSTACK_PUBLIC_KEY: ${{ env.DEPLOY_ENV == 'prod' && secrets.PROD_PAYSTACK_PUBLIC_KEY || secrets.STAGING_PAYSTACK_PUBLIC_KEY }}
        VITE_SOCKET_URL: ${{ env.DEPLOY_ENV == 'prod' && vars.PROD_SOCKET_URL || vars.STAGING_SOCKET_URL }}
      run: |
        bun install
        bun run build

    - name: Ensure Target Directories Exist
      run: |
        $baseDir = "C:\inetpub\wwwroot\${{ env.DEPLOY_ENV }}"
        New-Item -ItemType Directory -Force -Path "$baseDir\maxilotto-online-web${{ env.DEPLOY_SUFFIX }}"

    - name: Copy Files to IIS
      run: |
        $baseDir = "C:\inetpub\wwwroot\${{ env.DEPLOY_ENV }}"
        # Copied in three passes so that no visitor is ever sent to files that are not there yet:
        # first everything the pages load (hashed scripts, styles, images), then the HTML pages
        # that point to them, and last the service worker files that decide what installed apps
        # run. A plain Copy-Item copies in no particular order, so for a moment a new index.html
        # could ask for scripts that had not arrived. Nothing on the server is deleted: tabs still
        # running the previous build keep finding their files.
        $src = (Resolve-Path "dist").Path
        $dest = "$baseDir\maxilotto-online-web${{ env.DEPLOY_SUFFIX }}"
        $last = @('sw.js', 'registerSW.js', 'push-sw.js', 'manifest.webmanifest')
        $pass = { if ($last -contains $_.Name) { 2 } elseif ($_.Extension -eq '.html') { 1 } else { 0 } }
        Get-ChildItem -Path $src -Recurse -File | Sort-Object -Property @{ Expression = $pass } | ForEach-Object {
          $target = Join-Path $dest $_.FullName.Substring($src.Length + 1)
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          Copy-Item -LiteralPath $_.FullName -Destination $target -Force
        }

    # Tells Bing (and the other IndexNow engines: Yandex, Seznam, Naver) about every page in
    # the new sitemap, so changes are picked up within hours instead of on the next crawl.
    # Google does not use IndexNow; it finds the sitemap through robots.txt.
    # The key is public by design: https://maxilotto.ng/66c2fa91591feae30c8b01a5899393ea.txt proves the site is ours.
    - name: Notify search engines (IndexNow)
      if: env.DEPLOY_ENV == 'prod'
      continue-on-error: true
      run: |
        [xml]$sitemap = Get-Content "dist\sitemap.xml"
        $urls = @($sitemap.urlset.url | ForEach-Object { $_.loc })
        $body = @{
            host        = "maxilotto.ng"
            key         = "66c2fa91591feae30c8b01a5899393ea"
            keyLocation = "https://maxilotto.ng/66c2fa91591feae30c8b01a5899393ea.txt"
            urlList     = $urls
        } | ConvertTo-Json
        Invoke-RestMethod -Method Post -Uri "https://api.indexnow.org/indexnow" -ContentType "application/json; charset=utf-8" -Body $body
        Write-Host "Submitted $($urls.Count) URLs to IndexNow"
